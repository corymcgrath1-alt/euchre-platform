name: Unification verification

on:
  push:
    branches:
      - codex/unify-euchre-foundations-v1
  pull_request:
    branches:
      - codex/practice-vertical-slice-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Built-runtime browser tests
        run: npm run e2e

      - name: Run 10,000 deterministic simulations
        run: npm run simulate -- --games 10000 --seed 12345 --target-score 10 --stick-dealer true

      - name: Run 10,000 strict playtests
        run: npm run playtest -- --games 10000 --seed 12345 --target-score 10 --stick-dealer true --bot-policy intermediate-v1 --invariants strict --out playtest-results/ci-unification

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unification-browser-diagnostics
          if-no-files-found: ignore
          retention-days: 5
          path: |
            .data/playwright-report
            .data/playwright-results
