name: Euchre Club support
description: Report a gameplay, save, resume, review, or accessibility problem.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Do not include private device information, Apple account details, signing credentials, or game-store keys.
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: 1.0.0 (1)
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Practice seed
      description: Leave blank if the game did not use a known seed.
  - type: dropdown
    id: phase
    attributes:
      label: Game phase
      options:
        - Home or setup
        - Bidding
        - Dealer discard
        - Trick play
        - Hand result
        - Game result
        - History or review
        - Save or resume
        - Accessibility or layout
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the action, the result, and what you expected.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include private device, account, signing, or payment information.
          required: true
